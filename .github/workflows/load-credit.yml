name: Load 10bis credit

on:
  # Triggered Sunday-Thursday at 09:00 Israel time by cron-job.org
  # through the workflow_dispatch API, because GitHub's own schedule never fired.
  # If credit was already loaded today, the run stops after a quick check.
  workflow_dispatch:
    inputs:
      force:
        description: Run even if credit was already loaded today (for testing)
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  # The log issue: the bot comments there with ✅ / ❌ and the Israel date.
  # It is created on the first run if the repository does not have it yet.
  check:
    runs-on: ubuntu-24.04
    outputs:
      issue: ${{ steps.check.outputs.issue }}
      loaded: ${{ steps.check.outputs.loaded }}
      failed: ${{ steps.check.outputs.failed }}

    steps:
      - name: Check today's results in the log issue
        id: check
        run: |
          TITLE="יומן טעינות קרדיט"

          ISSUE=$(gh api "repos/$GH_REPO/issues?state=all&per_page=100" \
            --jq "map(select(.title == \"$TITLE\" and (.pull_request | not))) | .[0].number // empty")

          if [ -z "$ISSUE" ]; then
            URL=$(gh issue create --title "$TITLE" \
              --body "כאן נרשמת כל טעינת קרדיט, עם תיוג שמייצר מייל עדכון.")
            ISSUE=$(basename "$URL")
          fi

          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"

          TODAY=$(TZ=Asia/Jerusalem date '+%d/%m/%Y')
          SINCE=$(date -u -d '-2 days' '+%Y-%m-%dT%H:%M:%SZ')

          gh api "repos/$GH_REPO/issues/$ISSUE/comments?per_page=100&since=$SINCE" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body' > comments.txt

          if grep -q "✅.*$TODAY" comments.txt; then
            echo "Credit was already loaded today - nothing to do."
            echo "loaded=true" >> "$GITHUB_OUTPUT"
          fi

          if grep -q "❌.*$TODAY" comments.txt; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  load-credit:
    needs: check
    if: needs.check.outputs.loaded != 'true' || inputs.force
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      # The program lives in the shared Core repository. The version is pinned by
      # the tag: change v1 only when you want to move to a newer version.
      - uses: actions/checkout@v5
        with:
          repository: Avigail-Ehrlich/TenBisAutoCredit-Core
          ref: v1
          path: core

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build core -c Release

      - name: Install Chromium
        run: pwsh core/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # 10bis invalidates the session cookies when it refreshes them, so every
      # run saves the refreshed session to the Actions cache for the next run.
      # The cache key includes a hash of the TENBIS_STATE secret: after a new
      # --login and secret update, the old cached session is ignored.
      - name: Session cache key
        id: session
        run: echo "prefix=tenbis-session-$(printf '%s' "$TENBIS_STATE" | sha256sum | cut -c1-16)-" >> "$GITHUB_OUTPUT"
        env:
          TENBIS_STATE: ${{ secrets.TENBIS_STATE }}

      - name: Restore refreshed session
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/session
          key: ${{ steps.session.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.session.outputs.prefix }}

      - name: Write saved session
        run: |
          if [ -f "$RUNNER_TEMP/session/tenbis-state.json" ]; then
            echo "Using the refreshed session from the previous run."
          else
            echo "Using the session from the TENBIS_STATE secret."
            mkdir -p "$RUNNER_TEMP/session"
            printf '%s' "$TENBIS_STATE" > "$RUNNER_TEMP/session/tenbis-state.json"
          fi
        env:
          TENBIS_STATE: ${{ secrets.TENBIS_STATE }}

      # A failure here does not fail the run, so a failed day sends only one
      # email. The failure is reported once a day below.
      - name: Load credit
        id: load
        continue-on-error: true
        run: dotnet run --project core -c Release --no-build
        env:
          TENBIS_STATE_PATH: ${{ runner.temp }}/session/tenbis-state.json

      - name: Upload failure screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot
          path: core/bin/Release/net10.0/failure.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Save refreshed session
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/session
          key: ${{ steps.session.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}

      # Mentioning the owner in the log issue makes GitHub send an email.
      - name: Report result
        run: |
          LOG=core/bin/Release/net10.0/TenBisAutoCredit.log
          NOW=$(TZ=Asia/Jerusalem date '+%d/%m/%Y %H:%M')
          OWNER="@${{ github.repository_owner }}"
          ISSUE="${{ needs.check.outputs.issue }}"

          if grep -q "| SUCCESS" "$LOG" 2>/dev/null; then
            BALANCE=$(grep "| SUCCESS" "$LOG" | tail -1 | grep -o "Credit balance: [0-9.,]*" | cut -d' ' -f3)
            gh issue comment "$ISSUE" --body "$OWNER ✅ נטען קרדיט ב-10bis — $NOW${BALANCE:+
          יתרת קרדיט: ₪$BALANCE}"
          elif grep -q "| SKIPPED" "$LOG" 2>/dev/null && [ "${{ needs.check.outputs.loaded }}" != "true" ]; then
            # Credit is loaded but no ✅ was logged today (for example an earlier
            # run loaded it and then failed), so confirm it once.
            BALANCE=$(grep "| SKIPPED" "$LOG" | tail -1 | grep -o "Credit balance: [0-9.,]*" | cut -d' ' -f3)
            gh issue comment "$ISSUE" --body "$OWNER ✅ הקרדיט ב-10bis טעון להיום — $NOW${BALANCE:+
          יתרת קרדיט: ₪$BALANCE}"
          elif [ "${{ steps.load.outcome }}" = "failure" ]; then
            if [ "${{ needs.check.outputs.failed }}" = "true" ]; then
              echo "Failure was already reported today."
            else
              REASON=$(grep "| ERROR" "$LOG" 2>/dev/null | tail -1 | cut -d'|' -f4- | sed 's/^ *//')
              gh issue comment "$ISSUE" --body "$OWNER ❌ טעינת הקרדיט נכשלה — $NOW
          ${REASON:-The program failed without writing a result.}
          פרטים: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
